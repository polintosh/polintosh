<svg xmlns="http://www.w3.org/2000/svg" width="860" height="196" viewBox="0 0 860 196" role="img" aria-label="polintosh — principles">
<style>text { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Inter, Arial, sans-serif; }
.p { opacity: 0; animation: fade .8s ease-out forwards; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
<rect x="0.5" y="0.5" width="859" height="195" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="18" cy="16" r="5.5" fill="#ff5f57"/>
<circle cx="36" cy="16" r="5.5" fill="#febc2e"/>
<circle cx="54" cy="16" r="5.5" fill="#28c840"/>
<text x="430.0" y="20" fill="#8b949e" font-size="11" text-anchor="middle">polintosh — principles</text>
<line x1="1" y1="32" x2="859" y2="32" stroke="#30363d"/>
<text x="24" y="56" fill="#e6edf3" font-size="13"><tspan fill="#8b949e">polintosh@github ~ $</tspan> cat principles.md</text>
<g class="p" style="animation-delay:0.00s"><text class="sans" x="24.0" y="118" fill="#e6edf3" font-size="28" font-weight="600" letter-spacing="-0.5">Simple.</text><text class="sans" x="24.0" y="146" fill="#8b949e" font-size="13">Great software shouldn't</text><text class="sans" x="24.0" y="164" fill="#8b949e" font-size="13">need an instruction manual.</text></g>
<line x1="278.6666666666667" y1="88" x2="278.6666666666667" y2="168" stroke="#30363d"/>
<g class="p" style="animation-delay:0.25s"><text class="sans" x="294.6666666666667" y="118" fill="#e6edf3" font-size="28" font-weight="600" letter-spacing="-0.5">Meaningful.</text><text class="sans" x="294.6666666666667" y="146" fill="#8b949e" font-size="13">The best products make</text><text class="sans" x="294.6666666666667" y="164" fill="#8b949e" font-size="13">hard things look easy.</text></g>
<line x1="549.3333333333334" y1="88" x2="549.3333333333334" y2="168" stroke="#30363d"/>
<g class="p" style="animation-delay:0.50s"><text class="sans" x="565.3333333333334" y="118" fill="#e6edf3" font-size="28" font-weight="600" letter-spacing="-0.5">Human.</text><text class="sans" x="565.3333333333334" y="146" fill="#8b949e" font-size="13">The technology disappears.</text><text class="sans" x="565.3333333333334" y="164" fill="#8b949e" font-size="13">Only the magic remains.</text></g>
</svg>
